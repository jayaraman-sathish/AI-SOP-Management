services:
  - type: web
    name: sop-compliance-platform
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # -w 1: free tier has only 512MB RAM; a single worker avoids two workers each
    # holding a large base64-decoded upload in memory at once and getting OOM-killed.
    # --timeout 300: default gunicorn timeout is 30s, which large multi-file SOP
    # package uploads (several MB each, +33% from base64) can easily exceed.
    startCommand: "python seed.py && gunicorn -w 1 --timeout 300 -b 0.0.0.0:$PORT app:app"
    envVars:
      - key: APP_JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
    # NOTE: Render's free plan does not support persistent disks. Without one,
    # the SQLite database and any uploaded/generated files are wiped on every
    # restart/redeploy (Render's filesystem is ephemeral on free) -- fine for
    # a demo/pilot, not for real data. Upgrade this service to a paid plan and
    # add a `disk:` block back (see README "Deploying" section) once you're
    # past the demo stage and have real SOPs to keep.
